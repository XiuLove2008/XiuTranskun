<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MP3 → MIDI (Transkun v2)</title>
<style>
  body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}
  input,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
  button:disabled{background:#9ca3af}
  #log{background:#f3f4f6;padding:12px;border-radius:6px;white-space:pre-wrap;font-size:14px}
</style>
</head>
<body>
<h1>🎹 MP3 → MIDI</h1>
<p>Upload trực tiếp, xử lý bằng <b>Transkun v2</b> trên GitHub Actions.</p>

<input id="owner" placeholder="GitHub user/org">
<input id="repo"  placeholder="Tên repo">
<input id="token" type="password" placeholder="Fine-grained PAT (Contents: Read & write)">
<input id="file"  type="file" accept=".mp3,.wav,.m4a,.flac,.ogg">
<button id="go">Upload & chuyển đổi</button>
<div id="log">Sẵn sàng. Giới hạn ~45 MB / file.</div>

<script>
const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += "\n" + m; };
["owner","repo","token"].forEach(k => {
  $(k).value = localStorage.getItem(k) || "";
  $(k).onchange = () => localStorage.setItem(k, $(k).value);
});

const gh = (token) => (path, opt = {}) =>
  fetch("https://api.github.com" + path, {
    ...opt,
    headers: { Authorization: "Bearer " + token,
               Accept: "application/vnd.github+json",
               "Content-Type": "application/json" }
  });

const toBase64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);   // bỏ "data:...;base64,"
  r.onerror = rej;
  r.readAsDataURL(file);
});

$("go").onclick = async () => {
  const owner = $("owner").value.trim(), repo = $("repo").value.trim();
  const token = $("token").value.trim(), file = $("file").files[0];
  if (!owner || !repo || !token || !file) return alert("Điền đủ thông tin và chọn file");
  if (file.size > 45 * 1024 * 1024) return alert("File quá lớn (>45 MB)");

  const api = gh(token);
  const ext = file.name.split(".").pop().toLowerCase();
  const jobId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const path = `uploads/${jobId}.${ext}`;
  $("go").disabled = true;
  $("log").textContent = `Job ID: ${jobId}\nĐang mã hóa & upload ${(file.size/1048576).toFixed(1)} MB...`;

  try {
    // 1. Upload file vào repo → tự kích hoạt workflow
    const content = await toBase64(file);
    const up = await api(`/repos/${owner}/${repo}/contents/${path}`, {
      method: "PUT",
      body: JSON.stringify({ message: `upload ${jobId}`, content, branch: "main" })
    });
    if (!up.ok) throw new Error(`Upload lỗi ${up.status}: ${await up.text()}`);
    log("✅ Upload xong. Actions đang xử lý (5–15 phút với bài 3–4 phút)...");

    // 2. Poll Release
    const tag = "midi-" + jobId;
    for (let i = 0; i < 240; i++) {
      await new Promise(s => setTimeout(s, 15000));
      const rel = await api(`/repos/${owner}/${repo}/releases/tags/${tag}`);
      if (rel.ok) {
        const asset = (await rel.json()).assets.find(a => a.name.endsWith(".mid"));
        log("🎉 Hoàn tất!");
        const a = document.createElement("a");
        a.href = asset.browser_download_url; a.textContent = "⬇ Tải " + asset.name;
        $("log").append(document.createElement("br"), a);
        return;
      }
      log(`... đang xử lý (${(i+1)*15}s)`);
    }
    log(`⏰ Hết thời gian chờ. Xem https://github.com/${owner}/${repo}/actions`);
  } catch (e) {
    log("❌ " + e.message);
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
